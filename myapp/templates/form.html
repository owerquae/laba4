{% extends 'base.html' %}
{% block content %}
<h3>{% if edit %}Редактирование{% else %}Новая запись{% endif %}</h3>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    {% if not edit %}
    <div class="mb-3">
        <label>Куда сохранить:</label>
        <select name="save_to" class="form-select">
            <option value="db">В базу данных</option>
            <option value="file">В файл (JSON)</option>
        </select>
    </div>
    {% endif %}
    <button class="btn btn-primary">Сохранить</button>
    <a href="/" class="btn btn-secondary">Назад</a>
</form>
{% endblock %}
